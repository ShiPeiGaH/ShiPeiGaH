<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 270" width="1100" height="270" role="img" aria-label="Animated RPG skill tree showing Arli studying C programming Linux and computer systems">
<defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091127"/><stop offset="1" stop-color="#1f1336"/></linearGradient>
<style><![CDATA[
 .charge{animation:charge 4.5s cubic-bezier(.2,.8,.3,1) infinite;transform:scaleX(.08)}
 .tw{animation:twinkle 2.5s ease-in-out infinite alternate}
 .blink{animation:blink 1s steps(1) infinite}
 .arrow{animation:arrow 2s ease-in-out infinite}
 @keyframes charge{0%{transform:scaleX(.08);opacity:.4}48%,78%{transform:scaleX(1);opacity:.95}100%{transform:scaleX(.08);opacity:.5}}
 @keyframes twinkle{from{opacity:.1}to{opacity:.7}}
 @keyframes blink{50%{opacity:.05}}
 @keyframes arrow{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.charge{transform:scaleX(1)}}
]]></style></defs>
