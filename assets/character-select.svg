 <rect x="670" y="295" width="368" height="9" fill="#20183a" stroke="#6d28d9"/>
 <g class="spark"><rect x="1000" y="55" width="10" height="10" fill="#67e8f9"/><rect x="1005" y="50" width="2" height="20" fill="#f0abfc"/></g>
