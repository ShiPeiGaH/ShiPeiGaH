<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="Animated pixel art RPG player character Arli holding a glowing sword">
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1023"/><stop offset="1" stop-color="#20143b"/></linearGradient>
 <linearGradient id="blade" x1="0" x2="1"><stop stop-color="#f0abfc"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
 <style><![CDATA[
 .hero{animation:bob 2.2s ease-in-out infinite}.sword{transform-origin:130px 88px;animation:swing 3s ease-in-out infinite}
 .aura{animation:aura 3s ease-in-out infinite}.spark{animation:spark 3.8s ease-in-out infinite alternate}
 .light{animation:light 1.4s ease-in-out infinite alternate}.cursor{animation:blink .8s steps(1) infinite}
 .float{animation:bob 4s ease-in-out infinite}.bar{animation:bar 4s ease-in-out infinite}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(9deg)}}
 @keyframes aura{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:.5;transform:scale(1.1)}}
 @keyframes spark{0%{opacity:.1;transform:translateY(14px)}100%{opacity:1;transform:translateY(-15px)}}
 @keyframes light{0%{opacity:.35}100%{opacity:1}}
 @keyframes blink{50%{opacity:0}}
 @keyframes bar{0%{width:0px}55%,100%{width:305px}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
<rect width="1100" height="330" rx="16" fill="url(#night)"/>
<rect x="10" y="10" width="1080" height="310" rx="11" fill="none" stroke="#8b5cf6" opacity=".65" stroke-width="2"/>
<path d="M620 10V320" stroke="#a78bfa" opacity=".25" stroke-width="2" stroke-dasharray="5 10"/>
<rect x="660" y="24" width="8" height="8" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:0s"/><rect x="733" y="71" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0.33s"/><rect x="806" y="118" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0.66s"/><rect x="879" y="165" width="4" height="4" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:0.99s"/><rect x="952" y="212" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:1.32s"/><rect x="1025" y="259" width="8" height="8" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:1.6500000000000001s"/><rect x="698" y="61" width="4" height="4" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:1.98s"/><rect x="771" y="108" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:2.31s"/><rect x="844" y="155" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:2.64s"/><rect x="917" y="202" width="4" height="4" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:2.97s"/><rect x="990" y="249" width="8" height="8" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0s"/><rect x="663" y="51" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0.33s"/><rect x="736" y="98" width="4" height="4" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:0.66s"/><rect x="809" y="145" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0.99s"/><rect x="882" y="192" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:1.32s"/><rect x="955" y="239" width="8" height="8" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:1.6500000000000001s"/><rect x="1028" y="41" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:1.98s"/><rect x="701" y="88" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:2.31s"/><rect x="774" y="135" width="4" height="4" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:2.64s"/><rect x="847" y="182" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:2.97s"/><rect x="920" y="229" width="8" height="8" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0s"/><rect x="993" y="31" width="4" height="4" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:0.33s"/><rect x="666" y="78" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0.66s"/><rect x="739" y="125" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0.99s"/><rect x="812" y="172" width="4" height="4" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:1.32s"/><rect x="885" y="219" width="8" height="8" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:1.6500000000000001s"/><rect x="958" y="266" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:1.98s"/><rect x="1031" y="68" width="4" height="4" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:2.31s"/><rect x="704" y="115" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:2.64s"/><rect x="777" y="162" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:2.97s"/><rect x="850" y="209" width="8" height="8" fill="#67e8f9" opacity=".5" class="spark" style="animation-delay:0s"/><rect x="923" y="256" width="4" height="4" fill="#a78bfa" opacity=".5" class="spark" style="animation-delay:0.33s"/>
<g font-family="DejaVu Sans,Verdana,sans-serif">
 <text x="51" y="56" font-size="16" letter-spacing="4" fill="#67e8f9" font-weight="700">◈ PLAYER PROFILE // CHARACTER SELECT</text>
 <text x="51" y="113" font-size="51" letter-spacing="2" fill="#f8fafc" font-weight="900">ARLI <tspan fill="#a78bfa">THE BUILDER</tspan></text>
 <text x="54" y="153" font-size="20" fill="#c4b5fd">CLASS   : C PROGRAMMER</text>
 <text x="54" y="185" font-size="20" fill="#c4b5fd">GUILD   : COMPUTER ENGINEERING</text>
 <text x="54" y="217" font-size="20" fill="#c4b5fd">REGION  : LINUX REALM</text>
 <text x="54" y="264" font-size="16" fill="#67e8f9" font-weight="bold" letter-spacing="2">&gt; CURRENT QUEST: LEARN AND BUILD</text>
 <rect x="485" y="247" width="11" height="21" fill="#67e8f9" class="cursor"/>
 <rect x="54" y="288" width="420" height="9" rx="4" fill="#34304f"/>
 <rect x="54" y="288" width="305" height="9" rx="4" fill="#a78bfa" class="bar"/>
 <text x="485" y="299" font-size="12" fill="#a78bfa">XP IN PROGRESS</text>
</g>
<g>
