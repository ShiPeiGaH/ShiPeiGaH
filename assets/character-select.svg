   <!-- shield -->
   <path d="M-22 118L21 100L33 117L24 179L1 194L-22 170Z" fill="#312e81" stroke="#c4b5fd" stroke-width="5"/>
   <path d="M1 117V177 M-12 145H17" stroke="#67e8f9" stroke-width="6" class="light"/>
  </g>
