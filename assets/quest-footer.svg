<style><![CDATA[
.star{animation:tw 2.8s ease-in-out infinite alternate}
.runner{animation:run 9s linear infinite}.legs{animation:step .3s ease-in-out infinite alternate}
.heart{animation:beat .85s ease-in-out infinite alternate}.trail{animation:dash 6s linear infinite}
.cursor{animation:blink .85s steps(1) infinite}
@keyframes tw{from{opacity:.06;transform:translateY(5px)}to{opacity:.65;transform:translateY(-7px)}}
@keyframes run{0%{transform:translateX(-65px)}100%{transform:translateX(930px)}}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(6px)}}
@keyframes beat{to{transform:scale(1.2)}}
@keyframes dash{to{stroke-dashoffset:-140}}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style></defs>
