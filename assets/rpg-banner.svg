 <style><![CDATA[
  .tw{animation:twinkle 3.3s ease-in-out infinite alternate}
  .fly{animation:drift 4s ease-in-out infinite alternate}
  .orb{animation:float 4s ease-in-out infinite}
  .ring{transform-origin:918px 164px;animation:spin 22s linear infinite}
  .beam{animation:beam 6s ease-in-out infinite}
  .cursor{animation:blink 1s steps(1) infinite}
  .scan{animation:scan 8s linear infinite}
  .pulse{animation:pulse 2.5s ease-in-out infinite}
  .slash{animation:dash 4.8s linear infinite}
  @keyframes twinkle{0%{opacity:.12;transform:scale(.7)}100%{opacity:.9;transform:scale(1.2)}}
  @keyframes drift{0%{transform:translateY(7px);opacity:.15}100%{transform:translateY(-12px);opacity:.8}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes beam{0%,25%{opacity:0;transform:translate(-150px,50px)}40%{opacity:1}65%,100%{opacity:0;transform:translate(500px,-80px)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes scan{from{transform:translateY(-350px)}to{transform:translateY(350px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes dash{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
