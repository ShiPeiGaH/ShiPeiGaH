 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b19"/><stop offset=".52" stop-color="#14112d"/><stop offset="1" stop-color="#091428"/></linearGradient>
 <linearGradient id="frame" x1="0" x2="1"><stop stop-color="#53d8fb"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#e0e7ff" stop-opacity=".8"/><stop offset=".4" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
